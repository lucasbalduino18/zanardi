<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Despesas — mudou de endereço</title>

<!-- Redirecionamento sem JavaScript (só entra em ação se o script abaixo falhar) -->
<meta http-equiv="refresh" content="3; url=https://zanardi-app.onrender.com/">

<!-- Diz aos buscadores qual é o endereço verdadeiro, e pede para não indexar esta página -->
<link rel="canonical" href="https://zanardi-app.onrender.com/">
<meta name="robots" content="noindex, follow">

<style>
  :root {
    --fundo:   #0a0f1e;
    --cartao:  #131a2a;
    --borda:   #1f2937;
    --texto:   #e5e7eb;
    --suave:   #9ca3af;
    --destaque:#2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.6;
  }
  .cartao {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-left: 4px solid var(--destaque);
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 420px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .moeda { font-size: 44px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: .2px; }
  p  { color: var(--suave); font-size: 15px; margin: 0 0 22px; }
  .destino {
    display: block; font-size: 13px; color: var(--destaque);
    word-break: break-all; margin-bottom: 22px;
  }
  a.botao {
    display: inline-block; text-decoration: none;
    background: var(--destaque); color: #06231f;
    font-weight: 700; font-size: 15px;
    padding: 13px 26px; border-radius: 10px;
    transition: filter .15s ease;
  }
  a.botao:hover, a.botao:focus { filter: brightness(1.1); }
  .aviso { font-size: 13px; color: var(--suave); margin: 20px 0 0; }
  .barra {
    height: 3px; background: var(--borda); border-radius: 2px;
    overflow: hidden; margin-top: 24px;
  }
  .barra span {
    display: block; height: 100%; width: 100%;
    background: var(--destaque);
    transform-origin: left;
    animation: correr 3s linear forwards;
  }
  @keyframes correr { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .barra span { animation: none; } }
</style>
</head>
<body>
  <main class="cartao">
    <div class="moeda" aria-hidden="true">💰</div>
    <h1>O app mudou de endereço</h1>
    <p>Estamos te levando para o novo endereço. Atualize seu favorito.</p>
    <strong class="destino" id="destino">https://zanardi-app.onrender.com/</strong>
    <a class="botao" href="https://zanardi-app.onrender.com/" id="ir">Abrir agora</a>
    <p class="aviso">Se nada acontecer em alguns segundos, toque no botão acima.</p>
    <div class="barra" aria-hidden="true"><span></span></div>
  </main>

<script>
(function () {
  var NOVO = 'https://zanardi-app.onrender.com/';

  // Mantém ?parametros e #ancoras que estiverem na URL antiga
  var extras = (location.search || '') + (location.hash || '');
  var alvo = NOVO + extras;

  var link = document.getElementById('ir');
  if (link) link.href = alvo;
  var txt = document.getElementById('destino');
  if (txt) txt.textContent = alvo;

  // replace() em vez de href: não deixa rastro no histórico, então o botão
  // "voltar" do navegador não devolve o usuário para cá num laço infinito.
  try { location.replace(alvo); } catch (e) { location.href = alvo; }
})();
</script>
</body>
</html>
